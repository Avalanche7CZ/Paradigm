plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'com.diffplug.spotless' version '6.25.0'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
}

configurations {
    embeddedLogging
    developmentBootstrap { canBeConsumed = false }
    developmentRuntime { canBeConsumed = false }
}

version = rootProject.property('mod_version')
base { archivesName = 'Paradigm-forge-1.7.10' }

def generatedVersionDir = layout.buildDirectory.dir('generated/sources/version/java')
tasks.register('generateModVersion') {
    inputs.property('mod_version', project.version)
    outputs.dir(generatedVersionDir)
    doLast {
        def target = generatedVersionDir.get().file('eu/avalanche7/paradigm/ModVersion.java').asFile
        target.parentFile.mkdirs()
        target.text = """package eu.avalanche7.paradigm;
public final class ModVersion {
    public static final String VALUE = "${project.version}";
    private ModVersion() {}
}
"""
    }
}
sourceSets.main.java.srcDir(generatedVersionDir)
tasks.named('compileJava').configure { dependsOn tasks.named('generateModVersion') }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('compileJava', JavaCompile).configure {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

minecraft {
    mcVersion.set('1.7.10')
    lwjgl3Version.set('3.3.3')
}

def developmentJava = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}
def developmentOpens = [
        'java.base/java.io', 'java.base/java.lang.invoke', 'java.base/java.lang.ref',
        'java.base/java.lang.reflect', 'java.base/java.lang', 'java.base/java.net.spi',
        'java.base/java.net', 'java.base/java.nio.channels', 'java.base/java.nio.charset',
        'java.base/java.nio.file', 'java.base/java.nio', 'java.base/java.text',
        'java.base/java.time.chrono', 'java.base/java.time.format', 'java.base/java.time.temporal',
        'java.base/java.time.zone', 'java.base/java.time', 'java.base/java.util.concurrent.atomic',
        'java.base/java.util.concurrent.locks', 'java.base/java.util.jar', 'java.base/java.util.zip',
        'java.base/java.util', 'java.base/jdk.internal.loader', 'java.base/jdk.internal.misc',
        'java.base/jdk.internal.ref', 'java.base/jdk.internal.reflect', 'java.base/sun.nio.ch',
        'java.desktop/com.sun.imageio.plugins.png', 'java.desktop/sun.awt.image', 'java.desktop/sun.awt',
        'java.sql.rowset/javax.sql.rowset.serial', 'jdk.dynalink/jdk.dynalink.beans'
]
['runClient', 'runServer'].each { taskName ->
    tasks.named(taskName).configure {
        javaLauncher.set(developmentJava)
        if (taskName == 'runClient') {
            lwjglVersion.set(3)
        }
        if (providers.gradleProperty('legacyRunDir').isPresent()) {
            workingDir providers.gradleProperty('legacyRunDir').get()
        }
        classpath = configurations.developmentBootstrap + classpath + configurations.developmentRuntime
        systemProperty 'java.system.class.loader', 'com.gtnewhorizons.retrofuturabootstrap.RfbSystemClassLoader'
        systemProperty 'file.encoding', 'UTF-8'
        systemProperty(taskName == 'runClient' ? 'gradlestart.bouncerClient' : 'gradlestart.bouncerServer',
                'com.gtnewhorizons.retrofuturabootstrap.Main')
        extraJvmArgs.addAll(developmentOpens.collect { "--add-opens=${it}=ALL-UNNAMED" })
        extraJvmArgs.add('--add-opens=jdk.naming.dns/com.sun.jndi.dns=ALL-UNNAMED,java.naming')
        tweakClasses.add('org.spongepowered.asm.launch.MixinTweaker')
    }
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        toggleOffOn()
        importOrder 'java', 'javax', '', 'eu.avalanche7'
        removeUnusedImports()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencies {
    developmentBootstrap('com.github.GTNewHorizons:lwjgl3ify:2.1.16:forgePatches') { transitive = false }
    developmentRuntime('com.github.GTNewHorizons:lwjgl3ify:2.1.16:dev') { transitive = false }
    developmentRuntime('io.github.legacymoddingmc:unimixins:0.1.23:dev') { transitive = false }
    developmentRuntime 'org.slf4j:slf4j-api:2.0.9'
    developmentRuntime 'org.slf4j:slf4j-simple:2.0.9'
    compileOnly project(':common')
    compileOnly('io.github.legacymoddingmc:unimixins:0.1.23') { transitive = false }
    compileOnly('com.github.GTNewHorizons:GTNHLib:0.7.10:dev') { transitive = false }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
    compileOnly 'org.jetbrains:annotations:24.0.1'
    embeddedLogging 'org.slf4j:slf4j-api:2.0.9'
    embeddedLogging('org.slf4j:slf4j-simple:2.0.9') {
        transitive = false
    }
    testImplementation project(':common')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'
    testRuntimeOnly 'net.luckperms:api:5.4'
}

tasks.named('test', Test).configure { useJUnitPlatform() }

tasks.named('processResources', ProcessResources).configure {
    inputs.property('mod_version', project.version)
    filesMatching('mcmod.info') {
        expand(mod_version: project.version)
    }
}

tasks.named('jar', Jar).configure {
    dependsOn project(':common').tasks.named('jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(project(':common').tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

tasks.named('shadowJar').configure {
    archiveClassifier.set('shadow-dev')
    configurations = [project.configurations.embeddedLogging]
    dependsOn project(':common').tasks.named('jar')
    from({ zipTree(project(':common').tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    relocate 'org.slf4j', 'eu.avalanche7.paradigm.internal.slf4j'
    mergeServiceFiles()
}

tasks.named('reobfJar').configure {
    inputJar.set(tasks.named('shadowJar').flatMap { it.archiveFile })
    dependsOn tasks.named('shadowJar')
}


def mixinRefmap = layout.buildDirectory.file('generated/mixins/paradigm.refmap.json')
def mixinMappings = layout.buildDirectory.file('generated/mixins/paradigm.srg')
tasks.named('compileJava', JavaCompile).configure {
    dependsOn tasks.named('generateForgeSrgMappings')
    outputs.file(mixinRefmap)
    outputs.file(mixinMappings)
    doFirst {
        mixinRefmap.get().asFile.parentFile.mkdirs()
        options.compilerArgs += [
                "-AreobfSrgFile=${tasks.named('generateForgeSrgMappings').get().mcpToSrg.get().asFile}",
                "-AoutSrgFile=${mixinMappings.get().asFile}",
                "-AoutRefMapFile=${mixinRefmap.get().asFile}"
        ]
    }
}
tasks.named('reobfJar').configure {
    extraSrgFiles.from(mixinMappings)
}
tasks.named('processResources').configure {
    dependsOn tasks.named('compileJava')
    from(mixinRefmap)
}
[tasks.named('jar'), tasks.named('shadowJar')].each {
    it.configure {
        manifest.attributes(
                'FMLCorePlugin': 'eu.avalanche7.paradigm.bootstrap.ParadigmLoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
}
