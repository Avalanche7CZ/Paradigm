plugins {
    id 'java-library'
    id 'com.diffplug.spotless' version '6.25.0'
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        toggleOffOn()
        importOrder 'java', 'javax', '', 'eu.avalanche7'
        removeUnusedImports()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
}

def rawCommonVersion = rootProject.findProperty('mod_version')?.toString()
if (rawCommonVersion == null || rawCommonVersion.isBlank()) {
    throw new GradleException('Root gradle.properties must define mod_version.')
}
def commonSemver = rawCommonVersion ==~ /\d+\.\d+\.\d+[A-Za-z].*/
        ? rawCommonVersion.replaceFirst(/(\d+\.\d+\.\d+)([A-Za-z].*)/, '$1-$2')
        : rawCommonVersion
version = commonSemver
group = 'eu.avalanche7'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'com.google.code.gson:gson:2.10.1'

    compileOnly 'org.slf4j:slf4j-api:2.0.9'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.25.4'

    // LuckPerms API
    compileOnly('net.luckperms:api:5.4')

    // Annotations
    compileOnly 'org.jetbrains:annotations:24.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'
    testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(17)
}

def isolatedTestWork = layout.projectDirectory.dir("build/test-workspace-${rootProject.name}")
tasks.register('prepareTestWorkspace', Sync) {
    from layout.projectDirectory.dir('src/main')
    into isolatedTestWork.dir('src/main')
}

test {
    useJUnitPlatform()
    inputs.property('regressionMariaDb', providers.environmentVariable('PARADIGM_REGRESSION_MARIADB').orElse('false'))
    dependsOn tasks.named('prepareTestWorkspace')
    workingDir isolatedTestWork
    systemProperty 'vanish.source.root', projectDir.parentFile.absolutePath
    systemProperty 'paradigm.repository.root', projectDir.parentFile.absolutePath
}

jar {
    from(sourceSets.main.output)
}

tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Builds the compile-only public companion API artifact.'
    archiveBaseName.set('paradigm-api')
    from(sourceSets.main.output)
    include 'eu/avalanche7/paradigm/api/*.class'
    include 'eu/avalanche7/paradigm/api/internal/ApiProvider*.class'
    include 'eu/avalanche7/paradigm/api/internal/SimpleRegistration*.class'
}

tasks.named('assemble').configure {
    dependsOn tasks.named('apiJar')
}

def dashboardProjectDir = rootProject.layout.projectDirectory.dir('dashboard')
if (!dashboardProjectDir.asFile.exists()) {
    dashboardProjectDir = layout.projectDirectory.dir('../dashboard')
}
def dashboardOutput = layout.buildDirectory.dir('generated/dashboard')
def dashboardProcessedResources = layout.buildDirectory.dir('resources/main/dashboard')
def npmExecutable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('dashboardInstall', Exec) {
    group = 'build'
    description = 'Installs locked dashboard development dependencies (never used by the Minecraft runtime).'
    workingDir dashboardProjectDir
    commandLine npmExecutable, 'ci', '--no-audit', '--no-fund'
    inputs.files dashboardProjectDir.file('package.json'), dashboardProjectDir.file('package-lock.json')
    outputs.dir dashboardProjectDir.dir('node_modules')
}

tasks.register('dashboardBuild', Exec) {
    group = 'build'
    description = 'Compiles the TypeScript dashboard into bundled static resources.'
    dependsOn tasks.named('dashboardInstall')
    workingDir dashboardProjectDir
    commandLine npmExecutable, 'run', 'build', '--', '--outDir', dashboardOutput.get().asFile.absolutePath
    inputs.dir dashboardProjectDir.dir('src')
    inputs.dir dashboardProjectDir.dir('public')
    inputs.files dashboardProjectDir.file('index.html'), dashboardProjectDir.file('tsconfig.json'), dashboardProjectDir.file('vite.config.ts'), dashboardProjectDir.file('package.json'), dashboardProjectDir.file('package-lock.json')
    outputs.dir dashboardOutput
}

tasks.named('processResources').configure {
    dependsOn tasks.named('dashboardBuild')
    from(dashboardOutput) { into 'dashboard' }
    doFirst { dashboardProcessedResources.get().asFile.deleteDir() }
}
tasks.register('dashboardTest', Exec) {
    group = 'verification'
    description = 'Runs local dashboard behavioral tests when present.'
    onlyIf { dashboardProjectDir.dir('tests').asFile.exists() }
    dependsOn tasks.named('dashboardInstall')
    workingDir dashboardProjectDir
    commandLine npmExecutable, 'test'
}
tasks.named('check').configure { dependsOn tasks.named('dashboardTest') }
